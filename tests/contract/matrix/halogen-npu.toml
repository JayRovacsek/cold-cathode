# halogen-npu contract matrix — Phase 4 (plan §5).
#
# Every entry cites the spec section it proves:
#   docs/analysis/specs/halogen-npu.md (frozen contract, commit bf641c7).
#
# Modes: usage | selftest | replay | serve | listen | probe | flux | gemma |
#        tts | asr | vis | cache.
# Optional keys: env (inline table), deferred + reason, requires_gpu.
# Argument tokens: @fixture/<name> resolves to crates/cc-contract-tests/fixtures/<name>;
# @tmp/<name> resolves to the project-local .tmp/<name> scratch path (AGENTS.md);
# @repo/<path> resolves to <repo-root>/<path> (expanded in args and env values).
#
# Reference-binary execution on this host: the store binary exits 127 without
# AMD XRT (libxrt_coreutil.so.2, spec "Loadability caveat"). Every case sets
# LD_LIBRARY_PATH = "@repo/docs/analysis/evidence/halogen-npu/xrt-stub" (the
# committed XRT stub) so the reference actually executes its real CLI paths;
# the stub is inert for the Rust subject (its deps resolve via RUNPATH).
#
# Ground truth: docs/analysis/evidence/halogen-npu/cli-probes.txt (46 captured
# invocations) plus the Phase 4 re-probe of every live case below.

