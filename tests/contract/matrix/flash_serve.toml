# flash_serve contract matrix — Phase 3 (plan §5).
#
# Every entry cites the spec section it proves:
#   docs/analysis/specs/flash_serve.md (frozen contract, commit 4134bd2 + review fixes).
#
# Modes: serve | dispatch | repack | resident-gib | env.
# Optional keys: env (inline table), deferred + reason, requires_gpu.
# Argument tokens: @fixture/<name> resolves to crates/cc-contract-tests/fixtures/<name>;
# @tmp/<name> resolves to the project-local .tmp/<name> scratch path (AGENTS.md).
#
# Ground truth: docs/analysis/evidence/flash_serve/cli-probes.txt (49 captured
# invocations) plus the follow-up probes recorded in the Phase 3 commit bodies.
# On this GPU-less host every otherwise-valid serve invocation ends in the
# ROCm error (exit 1); that wording is part of the contract and is compared.

# ---------------------------------------------------------------------------
# serve mode — usage errors (exit 2, comparable without a GPU)
# ---------------------------------------------------------------------------

[[case]]
name = "serve-help"
mode = "serve"
spec = "Flag table — serve mode (--help row); Verbatim help text; Observed behaviours #2"
args = ["--help"]

[[case]]
name = "serve-version"
mode = "serve"
spec = "Flag table — serve mode (--version row); Verbatim help text; Observed behaviours #2"
args = ["--version"]

[[case]]
name = "serve-bogus-flag"
mode = "serve"
spec = "Entry points and modes (unknown flags → serve usage); Observed behaviours #2"
args = ["--bogus-flag"]

[[case]]
name = "serve-quiet"
mode = "serve"
spec = "Flag table — repack mode (--quiet is unknown in the serve grammar)"
args = ["--quiet"]

[[case]]
name = "serve-threads"
mode = "serve"
spec = "Flag table — repack mode (--threads is unknown in the serve grammar)"
args = ["--threads", "4"]

[[case]]
name = "serve-out"
mode = "serve"
spec = "Entry points and modes (--out is unknown in the serve grammar)"
args = ["--out", "y"]

[[case]]
name = "serve-head"
mode = "serve"
spec = "Flag table — repack mode (--head is unknown in the serve grammar)"
args = ["--head", "x"]

[[case]]
name = "serve-with-table"
mode = "serve"
spec = "Flag table — repack mode (--with-table is unknown in the serve grammar)"
args = ["--with-table"]

[[case]]
name = "serve-bind-missing-value"
mode = "serve"
spec = "Flag table — serve mode (every flag requires a separate value argument)"
args = ["--bind"]

[[case]]
name = "serve-ck-equals"
mode = "serve"
spec = "Entry points and modes (--flag=value is not supported anywhere)"
args = ["--ck=x"]

[[case]]
name = "serve-repack-equals"
mode = "serve"
spec = "Entry points and modes (--flag=value is not supported anywhere)"
args = ["--repack=x", "--out=y"]

[[case]]
name = "serve-ck-x-port"
mode = "serve"
spec = "Entry points and modes (--ck=x unknown; --port without a value)"
args = ["--ck=x", "--port"]

