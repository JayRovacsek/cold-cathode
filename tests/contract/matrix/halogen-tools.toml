# halogen-tools contract matrix — Phase 4 (plan §5).
#
# Every entry cites the spec section it proves:
#   docs/analysis/specs/halogen-tools.md (frozen contract, commit 71bf903).
#
# Ground truth: docs/analysis/evidence/halogen-tools/cli-probes.txt (32
# captured invocations) plus a Phase 4 re-probe of every live case below.
#
# The .hgn success paths are deferred (reason: hgn-format-not-reverse-
# engineered — no reference .hgn exists on this host and the subject-written
# header layout is decompile-derived, flash_serve review F3). The header
# *error* paths (shorter-than-a-header, GGUF) are proven live via
# @fixture/ files whose contents the reference accepts byte-exactly.
#
# Modes: help | unknown-verb | inspect | verify | ppl | niah | paired.
# Optional keys: deferred + reason.

# ---------------------------------------------------------------------------
# help paths — no args (exit 2), --help/-h/help (exit 0), all on stderr
# ---------------------------------------------------------------------------

[[case]]
name = "no-args"
mode = "help"
spec = "Dispatch rules (argc < 2 → help to stderr, exit 2); Observed behaviours #1"
args = []

[[case]]
name = "help-flag"
mode = "help"
spec = "Entry points and verbs (--help row, exit 0); Observed behaviours #1"
args = ["--help"]

[[case]]
name = "h-flag"
mode = "help"
spec = "Entry points and verbs (-h row, exit 0); Observed behaviours #1"
args = ["-h"]

[[case]]
name = "help-word"
mode = "help"
spec = "Entry points and verbs (help row, exit 0); Observed behaviours #1"
args = ["help"]

# ---------------------------------------------------------------------------
# unknown verbs — `halogen-tools: unknown verb '<x>'` + help, exit 2
# ---------------------------------------------------------------------------

[[case]]
name = "version-flag"
mode = "unknown-verb"
spec = "Dispatch rules (--version is NOT a version flag [RV]); Observed behaviours #1"
args = ["--version"]

[[case]]
name = "bogus-flag"
mode = "unknown-verb"
spec = "Dispatch rules (any other unknown verb → unknown-verb line + help, exit 2 [RV])"
args = ["--bogus"]

[[case]]
name = "Help-capital"
mode = "unknown-verb"
spec = "Dispatch rules (--Help [RV]; verb match is case-sensitive)"
args = ["--Help"]

[[case]]
name = "HELP-upper"
mode = "unknown-verb"
spec = "Entry points and verbs (case-sensitive match; HELP is not help — probed live in Phase 4)"
args = ["HELP"]

[[case]]
name = "V-flag"
mode = "unknown-verb"
spec = "Dispatch rules (-V [D], decompile-derived; probed live in Phase 4)"
args = ["-V"]

[[case]]
name = "INSPECT-upper"
mode = "unknown-verb"
spec = "Dispatch rules (INSPECT [D], case-sensitive verb match; probed live in Phase 4)"
args = ["INSPECT"]

# ---------------------------------------------------------------------------
# inspect — usage, cannot-open, positional-verbatim, threads variants,
# header error paths via fixtures
# ---------------------------------------------------------------------------

[[case]]
name = "inspect-no-file"
mode = "inspect"
spec = "Flag table — inspect (missing FILE row, usage exit 2 [RV]); Observed behaviours #2"
args = ["inspect"]

[[case]]
name = "inspect-nonexistent"
mode = "inspect"
spec = "Flag table — inspect (unreadable file → `cannot open <file>` exit 2 [RV]); Observed behaviours #3"
args = ["inspect", "/nonexistent.hgn"]

[[case]]
name = "inspect-json-flag-as-file"
mode = "inspect"
spec = "Flag table — inspect (FILE taken verbatim even if it starts with `-`: `inspect --json` → `cannot open --json` [RV]); Observed behaviours #3"
args = ["inspect", "--json"]

[[case]]
name = "inspect-nonexistent-bogus"
mode = "inspect"
spec = "Flag table — inspect (unknown flags ignored by the shared scanner; file check first [RV]); Observed behaviours #7"
args = ["inspect", "/nonexistent.hgn", "--bogus"]

[[case]]
name = "inspect-nonexistent-json"
mode = "inspect"
spec = "Flag table — inspect (--json flag with unreadable FILE [RV]); Observed behaviours #3"
args = ["inspect", "/nonexistent.hgn", "--json"]

[[case]]
name = "inspect-threads-nonnumeric"
mode = "inspect"
spec = "Flag table — inspect (--threads N clamped, never an error [D]; file-open precedes flag checks [RV]); Observed behaviours #7"
args = ["inspect", "x.hgn", "--threads", "x"]

[[case]]
name = "inspect-threads-dangling"
mode = "inspect"
spec = "Flag table — inspect (--threads without a value falls back to the default 8 [D]; file check first [RV]); Observed behaviours #7"
args = ["inspect", "x.hgn", "--threads"]

[[case]]
name = "inspect-threads-equals"
mode = "inspect"
spec = "Flag table — inspect (--threads N is matched as exact words; `--threads=4` is not the flag [D] and is ignored; file check first [RV])"
args = ["inspect", "x.hgn", "--threads=4"]

[[case]]
name = "inspect-all-flags"
mode = "inspect"
spec = "Flag table — inspect (--json --no-hash --threads 4 with unreadable FILE [RV])"
args = ["inspect", "x.hgn", "--json", "--no-hash", "--threads", "4"]

[[case]]
name = "inspect-junk-fixture"
mode = "inspect"
spec = "Flag table — inspect (file ≤ 103 bytes → `<file>: shorter than a header` exit 2 [D]; 44-byte fixture, re-probed live in Phase 4)"
args = ["inspect", "@fixture/junk.bin"]

[[case]]
name = "inspect-gguf-fixture"
mode = "inspect"
spec = "Flag table — inspect (first 4 bytes = GGUF → `<file>: a GGUF. …` exit 2 [D]; 124-byte GGUF fixture, wording re-probed live via verify in Phase 4)"
args = ["inspect", "@fixture/tensor-past-shard.gguf"]

[[case]]
name = "inspect-success"
mode = "inspect"
spec = "Flag table — inspect (success output, decompile-derived, not runtime-verifiable: no reference .hgn on this host)"
args = ["inspect", "@fixture/minimal.hgn"]
deferred = true
reason = "hgn-format-not-reverse-engineered"

