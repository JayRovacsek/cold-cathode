[[case]]
name = "verify-gguf-fixture"
mode = "verify"
spec = "Flag table — verify (GGUF magic → `FAIL <file>: a GGUF. …` stdout exit 1 [D]; 124-byte GGUF fixture, re-probed live in Phase 4)"
