[[case]]
name = "verify-junk-fixture"
mode = "verify"
spec = "Flag table — verify (file ≤ 103 bytes → `FAIL <file>: shorter than a header` stdout exit 1 [D]; 44-byte fixture, re-probed live in Phase 4)"
