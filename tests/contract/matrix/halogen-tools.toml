[[case]]
name = "verify-success"
mode = "verify"
spec = "Flag table — verify (PASS line, decompile-derived, not runtime-verifiable on this host)"
args = ["verify", "@fixture/minimal.hgn"]
deferred = true
reason = "hgn-format-not-reverse-engineered"

# ---------------------------------------------------------------------------
# ppl — usage, missing --ids, unreadable ids file (file checks precede
# flag-value checks); scoring itself is GPU-gated
# ---------------------------------------------------------------------------

[[case]]
name = "ppl-no-file"
mode = "ppl"
spec = "Flag table — ppl (missing FILE row, one-line usage exit 2 [RV]); Observed behaviours #2"
args = ["ppl"]

[[case]]
name = "ppl-no-ids"
mode = "ppl"
spec = "Flag table — ppl (--ids required → `ppl: --ids IDS.bin is required (a text front end is not built yet)` exit 2 [RV]); Observed behaviours #5"
args = ["ppl", "/nonexistent"]

[[case]]
name = "ppl-file-dash"
mode = "ppl"
spec = "Flag table — ppl (FILE starting with `-` → one-line usage [D]; probed live in Phase 4)"
args = ["ppl", "--ids", "y"]

[[case]]
name = "ppl-ids-unreadable"
mode = "ppl"
spec = "Observed behaviours #7 (file-open checks precede flag-value checks [RV]; probed live: ppl x --ids y)"
args = ["ppl", "x", "--ids", "y"]

[[case]]
name = "ppl-ids-chunk"
mode = "ppl"
spec = "Flag table — ppl (--chunk parsed but the ids file check fires first [RV]); probed live: ppl x --ids y --chunk 7"
args = ["ppl", "x", "--ids", "y", "--chunk", "7"]

[[case]]
name = "ppl-ids-chunk-out"
mode = "ppl"
spec = "Flag table — ppl (--out accepted; ids file check still first [RV]); probed live: ppl x --ids y --chunk 8 --out /dev/null"
args = ["ppl", "x", "--ids", "y", "--chunk", "8", "--out", "/dev/null"]

[[case]]
name = "ppl-success"
mode = "ppl"
spec = "Flag table — ppl (scoring is GPU-gated; engine path not exercised on this host, spec \"Runtime messages\")"
args = ["ppl", "@fixture/minimal.hgn", "--ids", "@fixture/junk.bin"]
deferred = true
reason = "hgn-format-not-reverse-engineered"

