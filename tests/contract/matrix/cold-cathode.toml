# ---------------------------------------------------------------------------
# env — the pinned image version and the Layer 2 derivations observable
# without launching (max-token cap note, YaRN gate and warning).
# ---------------------------------------------------------------------------

[[case]]
name = "pinned-image-version"
mode = "env"
spec = "Layer 1 (HALOGEN_IMAGE_VERSION 0.18.21 is a hard assignment, not overridable); Ground truth (HALOGEN_IMAGE_VERSION=9.9 row)"
args = ["bogus"]
env = { HALOGEN_OOM_SCORE_ADJ = "0", HALOGEN_IMAGE_VERSION = "9.9" }

[[case]]
name = "yarn-gate-exits-2"
mode = "env"
spec = "Layer 2 item 9 (max-token capping note, lines 59–71) + item 10 (YaRN gate, lines 73–77: exit 2 before the banner)"
args = ["bogus"]
env = { HALOGEN_OOM_SCORE_ADJ = "0", HALOGEN_CTX = "524288" }

[[case]]
name = "yarn-set-caps-max-tok"
mode = "env"
spec = "Layer 2 item 9 (HALOGEN_CTX > 262144 caps HALOGEN_MAX_TOK at 16384 with the exact note) with HALOGEN_ROPE_YARN set (gate passes, dispatch proceeds)"
args = ["bogus"]
env = { HALOGEN_OOM_SCORE_ADJ = "0", HALOGEN_CTX = "524288", HALOGEN_ROPE_YARN = "2" }

[[case]]
name = "yarn-warning-at-native-ctx"
mode = "env"
spec = "Layer 2 item 10 (HALOGEN_ROPE_YARN set with HALOGEN_CTX ≤ 262144 → WARNING line, continues)"
args = ["bogus"]
env = { HALOGEN_OOM_SCORE_ADJ = "0", HALOGEN_ROPE_YARN = "4" }
