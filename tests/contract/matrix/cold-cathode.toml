# ---------------------------------------------------------------------------
# convert — usage path and input validation (the repack itself is the
# deferred `all`-class launch; the checks before it are side-effect-free).
# ---------------------------------------------------------------------------

[[case]]
name = "convert-no-args"
mode = "convert"
spec = "The dispatch table (convert row, lines 1776–1784); Exact usage strings (convert usage, three lines, exit 2); Ground truth (`convert` row)"
args = ["convert"]
env = { HALOGEN_OOM_SCORE_ADJ = "0" }

[[case]]
name = "convert-missing-out"
mode = "convert"
spec = "The dispatch table (convert row, line 1779: empty IN or OUT → convert usage, exit 2)"
args = ["convert", "/nonexistent.gguf"]
env = { HALOGEN_OOM_SCORE_ADJ = "0" }

[[case]]
name = "convert-input-missing"
mode = "convert"
spec = "The dispatch table (convert row, line 1785: missing IN file → `is not there`, exit 1)"
args = ["convert", "/nonexistent.gguf", "@tmp/cold-cathode-out.hgn"]
env = { HALOGEN_OOM_SCORE_ADJ = "0" }

[[case]]
name = "convert-input-not-gguf"
mode = "convert"
spec = "The dispatch table (convert row, line 1786: first four bytes not GGUF → `is not a GGUF`, exit 1)"
args = ["convert", "@fixture/junk.bin", "@tmp/cold-cathode-out.hgn"]
env = { HALOGEN_OOM_SCORE_ADJ = "0" }

