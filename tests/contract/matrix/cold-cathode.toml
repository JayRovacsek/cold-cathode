# cold-cathode (launcher) contract matrix — Phase 4 (plan §5).
#
# Every entry cites the spec section it proves:
#   docs/analysis/specs/launcher.md (frozen contract, commit 47dafa6).
#
# Ground truth: the spec's "Ground truth (this host, 2026-11-03)" table plus
# a Phase 4 re-probe of every live case below against both binaries (the
# reference makeWrapper via the HALOGEN_COLD_CATHODE override and the subject
# via CARGO_BIN_EXE_cold-cathode), with HALOGEN_OOM_SCORE_ADJ=0 in every
# case env for determinism (spec open question 3 recommendation).
#
# The server-launching modes (all, engine, api, bench, sweep) and the Python
# tool modes (ppl, niah) are deferred: they spawn the stack or exec the
# Python front end (side effects, GPU). The `npu` mode is retired and fully
# encoded.
#
# Modes: dispatch | convert | inspect | verify | env.

# ---------------------------------------------------------------------------
# dispatch — banner rule, retired npu mode, usage, and the `${1:-all}`
# normalisation; the launching/tool modes are deferred.
# ---------------------------------------------------------------------------

[[case]]
name = "bogus-mode"
mode = "dispatch"
spec = "The dispatch table (anything-else row, entrypoint lines 1822–1823); Ground truth (`bogus` row)"
args = ["bogus"]
env = { HALOGEN_OOM_SCORE_ADJ = "0" }

[[case]]
name = "npu-retired"
mode = "dispatch"
spec = "The dispatch table (npu row, entrypoint line 1822: retirement line + general usage, exit 2); Ground truth (`npu` row)"
