[package]
name = "cc-contract-tests"
version = "0.1.0"
edition = "2021"

[lib]
name = "cc_contract_tests"
path = "src/lib.rs"

[dev-dependencies]
# One dev-dep per workspace binary so cargo exposes every `CARGO_BIN_EXE_<name>`
# to the integration tests (see src/gating.rs for the resolution rules).
cc-flash-serve = { path = "../cc-flash-serve" }
cc-halogen-tools = { path = "../cc-halogen-tools" }
cc-halogen-npu = { path = "../cc-halogen-npu" }
cc-halogen-healthcheck = { path = "../cc-halogen-healthcheck" }
cc-launcher = { path = "../cc-launcher" }
